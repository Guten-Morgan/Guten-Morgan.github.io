name: Refresh PWHL WAR data

# Rebuilds js/pwhl-data.js from the public PWHL-WAR model and commits it if the
# numbers changed. Daily at 08:00 UTC (after the previous night's games finish);
# also runnable by hand from the Actions tab.
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pwhl-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Check out model
        uses: actions/checkout@v4
        with:
          repository: Guten-Morgan/PWHL-WAR
          path: model

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: model/requirements.txt

      - name: Install dependencies
        run: pip install -r model/requirements.txt

      - name: Cache API responses
        uses: actions/cache@v4
        with:
          path: model/pwhl_war/data/raw/pbp_cache
          key: pwhl-api-${{ github.run_id }}
          restore-keys: pwhl-api-

      - name: Rebuild 2025-26 WAR
        working-directory: model
        run: python regen_2526.py

      - name: Export pwhl-data.js
        working-directory: model
        run: python export_js.py ../js/pwhl-data.js

      - name: Commit if the data changed
        run: |
          # PWHL_META carries a build timestamp; ignore it when deciding.
          if git diff --quiet -I'^const PWHL_META' -- js/pwhl-data.js; then
            echo "No data change; leaving the repo as is."
            git checkout -- js/pwhl-data.js
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add js/pwhl-data.js
            git commit -m "PWHL WAR: scheduled data refresh"
            git push
          fi
